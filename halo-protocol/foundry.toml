[profile.default]
src = "contracts"
test = "test/solidity"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "@uniswap/v4-core/=node_modules/@uniswap/v4-core/"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 128
fail_on_revert = false
